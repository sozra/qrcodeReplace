name: Check, build and deploy to Cloudflare

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: check-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://qr-replace.pages.dev
    env:
      CLOUDFLARE_ACCOUNT_ID: bab57804ce6e2b0f0431d30a54b23f5d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN at https://github.com/sozra/qrcodeReplace/settings/secrets/actions'
            exit 1
          fi
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-site
          path: dist/
      - name: Deploy the checked artifact to Pages production
        run: npm run deploy -- --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Verify production serves this commit and all assets
        run: npm run verify:deployment
      - name: Deployment summary
        run: |
          echo "Deployed and verified $GITHUB_SHA at https://qr-replace.pages.dev" >> "$GITHUB_STEP_SUMMARY"
